<header class="header">
  <div class="logo">
    <img class="img-logo" src="Logo.png" alt="JobFinder logo" />
  </div>
</header>

<main class="landing-main">
  <section class="landing-content container">
    <div class="landing-text">
      <p class="landing-eyebrow">AI-Powered Candidate Screening</p>
      <h1>Screen candidates.<br />Hire the best fit.</h1>
      <p class="landing-description">
        Upload your job requirements and multiple CVs — our AI ranks every candidate by
        relevance so you spend time on the right people, not paperwork.
      </p>
      <p-button label="Get Started" icon="pi pi-arrow-right" iconPos="right" (onClick)="startScreening()"
        styleClass="landing-cta-btn" />
    </div>

    <div class="landing-illustration">
      <img class="phone" src="Home.jpg" alt="Recruiter screening illustration" />
    </div>
  </section>
</main>
